{% extends "web/base.html" %}
{% block title %}Sign in{% endblock %}

{% block content %}
<div class="card narrow">
  <h1>Sign in</h1>
  {% if form.errors %}<p class="flash error">That username and password did not match.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Username</label>
    {{ form.username }}
    <label for="id_password">Password</label>
    {{ form.password }}
    <button type="submit">Sign in</button>
  </form>
  <p class="hint">No account yet? <a href="{% url 'signup' %}">Create one</a>.</p>
</div>
{% endblock %}
